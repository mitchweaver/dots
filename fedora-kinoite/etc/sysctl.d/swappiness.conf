# range: 1-200
# default: 60
#
# lower values hesitate to swap unless necessary (ex: 1)
# higher values push to swap when available to free up memory
#
# * systems with lots of memory 64gb+ you know you'll rarely fill using "1" is fine
# * for laptops with 16gb or less especially with zram/zswap you want higher (100+)
#
vm.swappiness=80

