# force wifi to come on boot
#
# if this isnt enabled tlp will try to disable it
# which causes it to intermittently not power on when asked to
# annoying when 50% time you reboot your wifi doesnt work
DEVICES_TO_ENABLE_ON_STARTUP="wifi"

# 1 = auto - selects PRF on AC and BAL on battery
TLP_AUTO_SWITCH=1

# what to do when no battery can be detected, force PRF mode
#
# this is just in case I accidentally have tlp running on a desktop/server :^)
#
# PRF=performance, BAL=balanced, SAV=power-saver
TLP_DEFAULT_MODE=PRF

# cpu perf thresholds
CPU_MIN_PERF_ON_PRF=0
CPU_MAX_PERF_ON_PRF=100
CPU_MIN_PERF_ON_BAL=0
CPU_MAX_PERF_ON_BAL=80
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=80

# change "balanced-performance" to "performance" when on AC
#
# tells cpu to favor higher clocks under load
# idle cores can still clock down and sleep in C-states
#
# note: available = performance balance_performance balance_power power
CPU_ENERGY_PERF_POLICY_ON_AC=performance
PLATFORM_PROFILE_ON_AC=performance

# set charge limit to 80% to extend battery longevity
#
# NOTE: can use "sudo tlp fullcharge" to allow charging to 100%
#       after next reboot tlp will read /etc/tlp.conf again and set it back to 80%
STOP_CHARGE_THRESH_BAT0=80

# this should be default but forcing on anyway
CPU_BOOST_ON_AC=1

# disable wake on lan (this is a laptop, who uses this?)
WOL_DISABLE=Y

# usb suspend
USB_AUTOSUSPEND=0
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_BTUSB=1
USB_EXCLUDE_PHONE=1
USB_EXCLUDE_PRINTER=1
USB_EXCLUDE_NETWORK=1
USB_EXCLUDE_WIFI=1

