# /etc/systemd/zram-generator.conf
#
# note: default is ram amount or 8192, whichever is less
#
[zram0]
# automatically sets to double ram
zram-size = ram * 2 + 2
# main options: zstd or lzo-rle
#
# ztd: better compression at slightly higher cpu cost
# lzo-rle: about 30% worse compression but less cpu tax
compression-algorithm = zstd

